version: '3.8'

services:
  # LocalStack - AWS services emulator
  localstack:
    image: localstack/localstack:latest
    container_name: vocal-remover-localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - SERVICES=s3,lambda,dynamodb,stepfunctions,logs,iam,apigateway,ecr,sts
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - LAMBDA_EXECUTOR=docker-reuse
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "./local/localstack-data:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./local/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
    networks:
      - vocal-remover-network

  # Local API Server (replaces API Gateway)
  api-server:
    build:
      context: .
      dockerfile: local/Dockerfile.api-server
    container_name: vocal-remover-api
    ports:
      - "3000:3000"
    environment:
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - UPLOAD_BUCKET=vocal-remover-upload-local
      - JOBS_TABLE=vocal-remover-jobs-local
      - RATE_LIMIT_TABLE=vocal-remover-rate-limit-local
      - STATE_MACHINE_ARN=arn:aws:states:us-east-1:000000000000:stateMachine:vocal-remover-processing-local
    volumes:
      - "./local/api-server:/app"
      - "./lambda:/lambda"
    depends_on:
      - localstack
    networks:
      - vocal-remover-network

  # Frontend Dev Server
  frontend:
    image: nginx:alpine
    container_name: vocal-remover-frontend
    ports:
      - "8080:80"
    volumes:
      - "./web-ui:/usr/share/nginx/html:ro"
      - "./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - api-server
    networks:
      - vocal-remover-network

  # Mock Processing Worker (simulates Lambda processing)
  worker:
    build:
      context: .
      dockerfile: local/Dockerfile.worker
    container_name: vocal-remover-worker
    environment:
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - UPLOAD_BUCKET=vocal-remover-upload-local
      - JOBS_TABLE=vocal-remover-jobs-local
      - PROCESSING_MODE=mock  # or 'real' for actual processing
    volumes:
      - "./local/worker:/app"
      - "./lambda:/lambda"
      - "./lib_v5:/lib_v5"
    depends_on:
      - localstack
    networks:
      - vocal-remover-network

networks:
  vocal-remover-network:
    driver: bridge

volumes:
  localstack-data:
